<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gains Log">
  <!-- Maskable: full-bleed background, artwork scaled into the inner 80% safe
       zone so Android can crop to a circle or squircle without clipping the bar. -->
  <rect width="512" height="512" fill="#0c0c0e"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)"
     stroke="#34c78f" stroke-linecap="round" fill="none">
    <line x1="168" y1="344" x2="344" y2="168" stroke-width="34"/>
    <line x1="120" y1="316" x2="196" y2="392" stroke-width="40"/>
    <line x1="316" y1="120" x2="392" y2="196" stroke-width="40"/>
    <line x1="168" y1="288" x2="224" y2="344" stroke-width="30" opacity="0.55"/>
    <line x1="288" y1="168" x2="344" y2="224" stroke-width="30" opacity="0.55"/>
  </g>
</svg>
